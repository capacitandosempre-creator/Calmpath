<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalmPath</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle at top, #0f172a, #020617);
    color:#e2e8f0;
    overflow-x:hidden;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    font-weight:600;
    font-size:32px;
    letter-spacing:1px;
    background: linear-gradient(90deg,#38bdf8,#6366f1);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.card{
    background: rgba(30,41,59,0.6);
    backdrop-filter: blur(12px);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:20px;
    padding:20px;
    margin-top:20px;
    box-shadow: 0 0 30px rgba(0,0,0,0.4);
    transition:0.4s;
}

.card:hover{
    transform: translateY(-3px);
}

input,button{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:none;
    margin-top:10px;
    font-size:15px;
}

input{
    background:#1e293b;
    color:white;
}

button{
    background:linear-gradient(90deg,#6366f1,#3b82f6);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    opacity:0.85;
}

/* Medidor circular */
.gauge{
    width:220px;
    height:220px;
    margin:auto;
    position:relative;
}

svg{
    transform:rotate(-90deg);
}

circle{
    fill:none;
    stroke-width:15;
    stroke-linecap:round;
}

#progressCircle{
    stroke:#22d3ee;
    stroke-dasharray:565;
    stroke-dashoffset:565;
    transition:1s ease;
    filter: drop-shadow(0 0 12px #22d3ee);
}

.centerText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

.centerText h2{
    font-size:38px;
    margin:0;
}

.dimensions{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:15px;
    margin-top:20px;
}

.dimension{
    background:#0f172a;
    padding:15px;
    border-radius:15px;
    text-align:center;
}

.bar{
    height:8px;
    border-radius:8px;
    background:#1e293b;
    margin-top:8px;
    overflow:hidden;
}

.bar-inner{
    height:100%;
    width:0%;
    background:#38bdf8;
    transition:0.6s;
}

.community input{
    margin-top:6px;
}

.small{
    font-size:13px;
    opacity:0.7;
    margin-top:8px;
}
</style>
</head>

<body>

<div class="container">

<h1>CalmPath</h1>

<div class="card">
<input type="text" id="localInput" placeholder="Digite o local (ex: Shopping Central)">
<button onclick="buscarLocal()">Analisar Ambiente</button>
</div>

<div id="dashboard" style="display:none;">

<div class="card">

<div class="gauge">
<svg width="220" height="220">
<circle cx="110" cy="110" r="90" stroke="#1e293b"/>
<circle id="progressCircle" cx="110" cy="110" r="90"/>
</svg>
<div class="centerText">
<h2 id="indiceValor">0</h2>
<p>Índice Sensorial</p>
</div>
</div>

<p id="statusTexto" style="text-align:center;margin-top:15px;"></p>
<p id="fonteTexto" class="small" style="text-align:center;"></p>

<div class="dimensions">
<div class="dimension">
🔊 Ruído
<div class="bar"><div id="barRuido" class="bar-inner"></div></div>
</div>
<div class="dimension">
💡 Luz
<div class="bar"><div id="barLuz" class="bar-inner"></div></div>
</div>
<div class="dimension">
👥 Movimento
<div class="bar"><div id="barMov" class="bar-inner"></div></div>
</div>
</div>

</div>

<div class="card community">
<h3>Atualizar pela Comunidade</h3>
<label>Ruído (0-100)</label>
<input type="number" id="cRuido" min="0" max="100">
<label>Luz (0-100)</label>
<input type="number" id="cLuz" min="0" max="100">
<label>Movimento (0-100)</label>
<input type="number" id="cMov" min="0" max="100">
<button onclick="enviarComunitario()">Enviar Atualização</button>
<p id="confirma" class="small"></p>
</div>

</div>

</div>

<script>

let localAtual="";
const circ = 2*Math.PI*90;

function buscarLocal(){
    const nome=document.getElementById("localInput").value.trim();
    if(!nome) return;
    localAtual=nome;
    document.getElementById("dashboard").style.display="block";
    calcularIndice();
}

function calcularIndice(){

    const hora=new Date().getHours();
    const dia=new Date().getDay();

    let ruido=30;
    let luz=30;
    let movimento=30;

    if(hora>=12 && hora<=14){ ruido+=25; movimento+=30; }
    if(hora>=17 && hora<=19){ movimento+=35; }
    if(dia==6 || dia==0){ movimento+=20; }

    let comunidade=JSON.parse(localStorage.getItem("com_"+localAtual));
    let fonte="Previsão inteligente";

    if(comunidade){
        let minutos=(Date.now()-comunidade.timestamp)/60000;
        if(minutos<60){
            ruido=Math.round((ruido+comunidade.ruido)/2);
            luz=Math.round((luz+comunidade.luz)/2);
            movimento=Math.round((movimento+comunidade.mov)/2);
            fonte="Atualizado pela comunidade há "+Math.round(minutos)+" min";
        }
    }

    ruido=Math.min(100,ruido);
    luz=Math.min(100,luz);
    movimento=Math.min(100,movimento);

    let indice=Math.round((ruido+luz+movimento)/3);

    atualizarUI(indice,ruido,luz,movimento);
    document.getElementById("fonteTexto").innerText=fonte;
}

function atualizarUI(indice,ruido,luz,movimento){

    document.getElementById("indiceValor").innerText=indice;

    let offset=circ-(indice/100)*circ;
    document.getElementById("progressCircle").style.strokeDashoffset=offset;

    let cor="#22d3ee";
    if(indice>60) cor="#f97316";
    if(indice>80) cor="#ef4444";

    document.getElementById("progressCircle").style.stroke=cor;
    document.getElementById("progressCircle").style.filter="drop-shadow(0 0 15px "+cor+")";

    document.getElementById("barRuido").style.width=ruido+"%";
    document.getElementById("barLuz").style.width=luz+"%";
    document.getElementById("barMov").style.width=movimento+"%";

    let status="Ambiente equilibrado";
    if(indice>60) status="Planejamento recomendado";
    if(indice>80) status="Alto risco sensorial";

    document.getElementById("statusTexto").innerText=status;
}

function enviarComunitario(){

    if(!localAtual) return;

    const ruido=Number(document.getElementById("cRuido").value)||0;
    const luz=Number(document.getElementById("cLuz").value)||0;
    const mov=Number(document.getElementById("cMov").value)||0;

    const dados={
        ruido,luz,mov,
        timestamp:Date.now()
    };

    localStorage.setItem("com_"+localAtual,JSON.stringify(dados));
    document.getElementById("confirma").innerText="Atualização enviada com sucesso.";
    calcularIndice();
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalmPath</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:radial-gradient(circle at top,#0f172a,#020617);
    color:#e2e8f0;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    font-size:32px;
    background:linear-gradient(90deg,#38bdf8,#6366f1);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.card{
    background:rgba(30,41,59,0.6);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:20px;
    margin-top:20px;
    box-shadow:0 0 25px rgba(0,0,0,0.4);
}

input,button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border-radius:12px;
    border:none;
    font-size:15px;
}

input{
    background:#1e293b;
    color:white;
}

button{
    background:linear-gradient(90deg,#6366f1,#3b82f6);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    transform:scale(1.02);
}

.gauge{
    width:240px;
    height:240px;
    margin:auto;
    position:relative;
}

svg{ transform:rotate(-90deg); }

circle{
    fill:none;
    stroke-width:18;
    stroke-linecap:round;
}

#progressCircle{
    stroke:#22d3ee;
    stroke-dasharray:565;
    stroke-dashoffset:565;
    transition:1s ease;
}

.centerText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

.centerText h2{
    font-size:42px;
    margin:0;
}

.status{
    text-align:center;
    margin-top:15px;
    font-weight:500;
}

.small{
    font-size:13px;
    opacity:0.7;
    text-align:center;
}
</style>
</head>

<body>
<div class="container">

<h1>CalmPath</h1>

<div class="card">
<input type="text" id="localInput" placeholder="Digite o local (ex: Shopping Iguatemi)">
<button onclick="buscarLocal()">Analisar Ambiente</button>
</div>

<div id="dashboard" class="card" style="display:none;">

<div class="gauge">
<svg width="240" height="240">
<circle cx="120" cy="120" r="90" stroke="#1e293b"/>
<circle id="progressCircle" cx="120" cy="120" r="90"/>
</svg>
<div class="centerText">
<h2 id="indiceValor">0</h2>
<p>Índice de Desconforto</p>
</div>
</div>

<div class="status" id="statusTexto"></div>
<p class="small" id="explicacao"></p>

</div>
</div>

<script>

const circ = 2 * Math.PI * 90;

async function buscarLocal(){

    const nome = document.getElementById("localInput").value.trim();
    if(!nome) return;

    document.getElementById("statusTexto").innerText="Buscando local...";
    document.getElementById("dashboard").style.display="block";

    try{

        // 1️⃣ Buscar coordenadas pelo nome
        const geoRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(nome)}`);
        const geoData = await geoRes.json();

        if(!geoData.length){
            document.getElementById("statusTexto").innerText="Local não encontrado.";
            return;
        }

        const lat = geoData[0].lat;
        const lon = geoData[0].lon;
        const tipo = geoData[0].type;

        // 2️⃣ Buscar clima em tempo real
        const climaRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
        const climaData = await climaRes.json();

        const temp = climaData.current_weather.temperature;
        const vento = climaData.current_weather.windspeed;

        calcularIndice(tipo,temp,vento);

    }catch(e){
        document.getElementById("statusTexto").innerText="Erro ao buscar dados.";
    }
}

function calcularIndice(tipo,temp,vento){

    let indice = 30;

    const hora = new Date().getHours();
    const dia = new Date().getDay();

    // horário de pico
    if(hora>=12 && hora<=14) indice+=20;
    if(hora>=17 && hora<=19) indice+=25;
    if(dia==0 || dia==6) indice+=15;

    // tipo do local
    if(tipo.includes("shop") || tipo.includes("mall")) indice+=25;
    if(tipo.includes("restaurant")) indice+=15;
    if(tipo.includes("park")) indice-=10;
    if(tipo.includes("cemetery")) indice-=20;

    // clima
    if(temp>30) indice+=15;
    if(vento>20) indice+=10;

    indice=Math.max(0,Math.min(100,indice));

    atualizarUI(indice,tipo,temp,vento);
}

function atualizarUI(indice,tipo,temp,vento){

    document.getElementById("indiceValor").innerText=indice;

    const offset = circ - (indice/100)*circ;
    const circle = document.getElementById("progressCircle");
    circle.style.strokeDashoffset = offset;

    let cor="#22c55e";
    let status="Ambiente confortável";

    if(indice>40){
        cor="#eab308";
        status="Atenção moderada";
    }
    if(indice>65){
        cor="#f97316";
        status="Planejamento recomendado";
    }
    if(indice>80){
        cor="#ef4444";
        status="Alto risco sensorial";
    }

    circle.style.stroke = cor;
    circle.style.filter = `drop-shadow(0 0 15px ${cor})`;

    document.getElementById("statusTexto").innerText=status;

    document.getElementById("explicacao").innerText =
        `Tipo: ${tipo} | Temperatura: ${temp}°C | Vento: ${vento} km/h`;
}

</script>

</body>
</html>

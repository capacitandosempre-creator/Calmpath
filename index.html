<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalmPath</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: radial-gradient(circle at 20% 20%, #0f172a, #020617 70%);
  font-family: system-ui, -apple-system, sans-serif;
}

.glass {
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.06);
}

.progress-bar {
  transition: width 0.6s ease, background 0.6s ease;
}

.metric-card {
  transition: transform 0.3s ease;
}
.metric-card:hover {
  transform: scale(1.03);
}
</style>
</head>

<body class="text-slate-200 min-h-screen p-6">

<header class="text-center mb-8">
  <h1 class="text-5xl font-semibold text-emerald-400 tracking-wide">CalmPath</h1>
  <p class="text-slate-400 mt-2">Inteligência sensorial preditiva</p>
</header>

<main class="max-w-md mx-auto space-y-6">

<div class="glass p-6 rounded-3xl">
  <input id="search" type="text"
  placeholder="Digite um local..."
  class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white outline-none mb-4">

  <button onclick="buscarLocal()"
  class="w-full bg-emerald-600 hover:bg-emerald-700 p-4 rounded-xl font-medium">
  Analisar ambiente
  </button>
</div>

<div id="dashboard" class="hidden space-y-6">

<div class="glass p-6 rounded-3xl text-center">
  <h2 id="nomeLocal" class="text-xl font-semibold mb-2"></h2>
  <p id="indiceGeral" class="text-4xl font-bold"></p>

  <div class="w-full bg-slate-800 rounded-full h-3 mt-4">
    <div id="barraGeral"
    class="h-3 rounded-full progress-bar"
    style="width: 0%">
    </div>
  </div>

  <p id="classificacao" class="mt-3 text-sm text-slate-400"></p>
  <p id="tempoAtualizacao" class="mt-1 text-xs text-slate-500"></p>
</div>

<div class="grid grid-cols-2 gap-4">

<div class="glass p-4 rounded-2xl metric-card">
  <p>🔊 Ruído</p>
  <div class="w-full bg-slate-800 rounded-full h-2 mt-2">
    <div id="ruidoBar" class="h-2 rounded-full progress-bar"></div>
  </div>
</div>

<div class="glass p-4 rounded-2xl metric-card">
  <p>💡 Luz</p>
  <div class="w-full bg-slate-800 rounded-full h-2 mt-2">
    <div id="luzBar" class="h-2 rounded-full progress-bar"></div>
  </div>
</div>

<div class="glass p-4 rounded-2xl metric-card">
  <p>👥 Movimento</p>
  <div class="w-full bg-slate-800 rounded-full h-2 mt-2">
    <div id="movimentoBar" class="h-2 rounded-full progress-bar"></div>
  </div>
</div>

<div class="glass p-4 rounded-2xl metric-card">
  <p>🚗 Trânsito</p>
  <div class="w-full bg-slate-800 rounded-full h-2 mt-2">
    <div id="transitoBar" class="h-2 rounded-full progress-bar"></div>
  </div>
</div>

</div>

<!-- Avaliação em tempo real -->
<div class="glass p-5 rounded-2xl space-y-4">
  <h3 class="text-sm text-slate-400">Atualizar dados em tempo real</h3>

  <input type="range" id="inputRuido" min="0" max="100" value="30" class="w-full">
  <label class="text-xs text-slate-400">Ruído</label>

  <input type="range" id="inputLuz" min="0" max="100" value="30" class="w-full">
  <label class="text-xs text-slate-400">Luz</label>

  <input type="range" id="inputMovimento" min="0" max="100" value="30" class="w-full">
  <label class="text-xs text-slate-400">Movimento</label>

  <button onclick="enviarRelato()"
  class="w-full bg-indigo-600 hover:bg-indigo-700 p-3 rounded-xl text-sm">
  Enviar atualização
  </button>

  <p id="infoRelato" class="text-xs text-slate-500"></p>
</div>

</div>

</main>

<script>

let localAtual = "";

async function buscarLocal() {

  const query = document.getElementById("search").value;
  if(query.length < 3) return;

  const response = await fetch(
  `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`
  );

  const data = await response.json();
  if(data.length === 0) return;

  localAtual = data[0].display_name;
  document.getElementById("nomeLocal").innerText = data[0].display_name.split(",")[0];

  calcularSensores();
  document.getElementById("dashboard").classList.remove("hidden");
}

function calcularSensores(){

  const hora = new Date().getHours();
  const dia = new Date().getDay();

  let ruido = 30 + (hora >=12 && hora <=14 ? 25 : 0);
  let movimento = 35 + (dia === 6 ? 25 : 0);
  let luz = (hora >=18 || hora <=6) ? 60 : 25;
  let transito = (hora >=17 && hora <=19) ? 70 : 30;

  const relato = JSON.parse(localStorage.getItem(localAtual));

  if(relato && (Date.now() - relato.timestamp < 3600000)){
    ruido = (ruido*0.6)+(relato.ruido*0.4);
    luz = (luz*0.6)+(relato.luz*0.4);
    movimento = (movimento*0.6)+(relato.movimento*0.4);
    document.getElementById("tempoAtualizacao").innerText =
      "Atualizado com dados da comunidade há " +
      Math.floor((Date.now()-relato.timestamp)/60000) + " min";
  } else {
    document.getElementById("tempoAtualizacao").innerText =
      "Baseado em previsão inteligente.";
  }

  atualizarUI(ruido,luz,movimento,transito);
}

function atualizarUI(r,l,m,t){

  const geral = Math.round((r+l+m+t)/4);

  atualizarBarra("ruidoBar",r);
  atualizarBarra("luzBar",l);
  atualizarBarra("movimentoBar",m);
  atualizarBarra("transitoBar",t);

  atualizarBarra("barraGeral",geral);

  document.getElementById("indiceGeral").innerText = geral+"/100";

  let texto="";
  if(geral<30) texto="Confortável";
  else if(geral<60) texto="Moderado";
  else if(geral<80) texto="Sensível";
  else texto="Alta sobrecarga";

  document.getElementById("classificacao").innerText = texto;
}

function atualizarBarra(id,valor){

  const bar = document.getElementById(id);
  bar.style.width = valor+"%";

  if(valor<30) bar.style.background="#22c55e";
  else if(valor<60) bar.style.background="#eab308";
  else if(valor<80) bar.style.background="#f97316";
  else bar.style.background="#ef4444";
}

function enviarRelato(){

  const ruido = Number(document.getElementById("inputRuido").value);
  const luz = Number(document.getElementById("inputLuz").value);
  const movimento = Number(document.getElementById("inputMovimento").value);

  const relato = {
    ruido,
    luz,
    movimento,
    timestamp: Date.now()
  };

  localStorage.setItem(localAtual, JSON.stringify(relato));

  document.getElementById("infoRelato").innerText =
    "Atualização enviada com sucesso.";

  calcularSensores();
}

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalmPath</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://maps.googleapis.com/maps/api/js?key=SUA_CHAVE_AQUI&libraries=places"></script>

<style>
body {
    background: linear-gradient(180deg, #0f172a, #0b1120);
    color: #e2e8f0;
    font-family: 'Inter', sans-serif;
}
.glass {
    background: rgba(30, 41, 59, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,0.05);
}
.soft-green { background: #064e3b; }
.soft-yellow { background: #78350f; }
.soft-red { background: #7f1d1d; }
.fade { animation: fade 0.6s ease-in-out; }
@keyframes fade {
    from { opacity:0; transform:translateY(10px);}
    to { opacity:1; transform:translateY(0);}
}
</style>
</head>

<body class="min-h-screen p-6 pb-24">

<header class="text-center mb-8">
    <h1 class="text-4xl font-semibold tracking-tight text-emerald-400">CalmPath</h1>
    <p class="text-slate-400 text-sm mt-2">Inteligência sensorial para decisões mais tranquilas</p>
</header>

<main class="max-w-md mx-auto space-y-6">

<div class="glass p-6 rounded-3xl">
    <input id="search" type="text" placeholder="Digite um local (ex: shopping, parque...)"
    class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white outline-none mb-4">

    <button onclick="buscarLocal()" 
    class="w-full bg-emerald-600 hover:bg-emerald-700 transition p-4 rounded-xl font-medium">
        Analisar ambiente
    </button>
</div>

<div id="resultado" class="hidden fade glass p-6 rounded-3xl space-y-4">
    <h2 id="nomeLocal" class="text-xl font-semibold"></h2>
    <p id="enderecoLocal" class="text-slate-400 text-sm"></p>

    <div id="statusBox" class="p-6 rounded-2xl text-center transition-all duration-500">
        <div id="statusTexto" class="text-2xl font-semibold mb-2"></div>
        <p id="descricaoTexto" class="text-sm opacity-80"></p>
    </div>

    <div class="glass p-4 rounded-xl">
        <h3 class="text-sm font-semibold mb-3">👥 Comunidade agora</h3>

        <select id="movimento" class="w-full mb-2 bg-slate-800 p-2 rounded-lg">
            <option value="">Movimento observado</option>
            <option value="1">Baixo</option>
            <option value="2">Moderado</option>
            <option value="3">Alto</option>
        </select>

        <select id="ruido" class="w-full mb-3 bg-slate-800 p-2 rounded-lg">
            <option value="">Ruído percebido</option>
            <option value="1">Baixo</option>
            <option value="2">Moderado</option>
            <option value="3">Alto</option>
        </select>

        <button onclick="enviarRelato()" 
        class="w-full bg-slate-700 hover:bg-slate-600 transition p-3 rounded-xl text-sm">
            Enviar relato
        </button>
    </div>
</div>

</main>

<script>

let currentPlaceId = null;

function buscarLocal() {

    const query = document.getElementById('search').value;
    if(query.length < 3) return alert("Digite um local válido.");

    const service = new google.maps.places.PlacesService(document.createElement('div'));

    service.findPlaceFromQuery({
        query: query,
        fields: ['name','formatted_address','types','place_id']
    }, (results, status) => {

        if(status === google.maps.places.PlacesServiceStatus.OK && results[0]) {

            const local = results[0];
            currentPlaceId = local.place_id;

            document.getElementById('nomeLocal').innerText = local.name;
            document.getElementById('enderecoLocal').innerText = local.formatted_address;

            calcularStatus(local.types);

            document.getElementById('resultado').classList.remove('hidden');
        } else {
            alert("Local não encontrado.");
        }
    });
}

function calcularStatus(tipos) {

    const agora = new Date();
    const hora = agora.getHours();
    const dia = agora.getDay();

    let indice = 40;

    if(hora >= 12 && hora <= 14) indice += 20;
    if(hora >= 18 && hora <= 20) indice += 25;
    if(dia === 5 && hora >= 18) indice += 20;
    if(dia === 0 && hora >= 14) indice += 25;

    if(tipos.includes('shopping_mall')) indice += 15;
    if(tipos.includes('park') && (hora < 10 || hora > 17)) indice -= 15;

    let comunitario = obterRelatoRecente();
    let pesoComunitario = comunitario ? 0.5 : 0.3;

    let finalScore = (indice * (1 - pesoComunitario)) + 
                     ((comunitario || 40) * pesoComunitario);

    exibirStatus(finalScore);
}

function obterRelatoRecente() {

    if(!currentPlaceId) return null;

    const dados = JSON.parse(localStorage.getItem(currentPlaceId));
    if(!dados) return null;

    const agora = Date.now();
    const duasHoras = 2 * 60 * 60 * 1000;

    if(agora - dados.timestamp > duasHoras) return null;

    return (dados.movimento * 20) + (dados.ruido * 15);
}

function enviarRelato() {

    if(!currentPlaceId) return;

    const movimento = parseInt(document.getElementById('movimento').value);
    const ruido = parseInt(document.getElementById('ruido').value);

    if(!movimento || !ruido) return alert("Preencha movimento e ruído.");

    const dados = {
        movimento,
        ruido,
        timestamp: Date.now()
    };

    localStorage.setItem(currentPlaceId, JSON.stringify(dados));

    alert("Relato registrado. Obrigado por contribuir.");
    calcularStatus([]);
}

function exibirStatus(score) {

    const box = document.getElementById('statusBox');
    const texto = document.getElementById('statusTexto');
    const desc = document.getElementById('descricaoTexto');

    if(score < 50) {
        box.className = "p-6 rounded-2xl text-center soft-green";
        texto.innerText = "🟢 Zona Segura";
        desc.innerText = "Baixo estímulo no momento. Ambiente favorável para permanência tranquila.";
    }
    else if(score < 75) {
        box.className = "p-6 rounded-2xl text-center soft-yellow";
        texto.innerText = "🟡 Atenção Sensorial";
        desc.innerText = "Estímulo moderado. Avalie sua energia antes de permanecer.";
    }
    else {
        box.className = "p-6 rounded-2xl text-center soft-red";
        texto.innerText = "🔴 Estímulo Elevado";
        desc.innerText = "Ambiente potencialmente sobrecarregante neste momento.";
    }
}

</script>

</body>
</html>

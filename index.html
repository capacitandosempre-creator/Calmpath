<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CalmPath</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY"></script>

<style>

body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(180deg,#0f172a,#020617);
color:white;
}

header{
text-align:center;
padding:20px;
}

h1{
font-size:38px;
background:linear-gradient(90deg,#38bdf8,#6366f1);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:20px;
margin-top:20px;
}

input,button,select{
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:none;
}

button{
background:#3b82f6;
color:white;
cursor:pointer;
}

button:hover{
background:#6366f1;
}

#map{
height:350px;
border-radius:16px;
margin-top:10px;
}

.post{
background:#020617;
padding:10px;
border-radius:10px;
margin-top:10px;
}

.rank-item{
border-bottom:1px solid #334155;
padding:8px;
}

canvas{
background:#020617;
border-radius:12px;
padding:10px;
}

</style>
</head>

<body>

<header>

<h1>CalmPath</h1>
<p>Mapa sensorial para neurodivergentes</p>

</header>

<div class="container">

<!-- LOGIN -->

<div class="card">

<h3>Login</h3>

<input id="email" placeholder="Seu email">

<button onclick="login()">Entrar</button>

<p id="loginStatus"></p>

</div>

<!-- PERFIL -->

<div class="card">

<h3>Perfil sensorial</h3>

<select id="perfil">

<option value="som">Sensível a barulho</option>
<option value="luz">Sensível à luz</option>
<option value="multidao">Sensível à multidão</option>

</select>

<button onclick="salvarPerfil()">Salvar</button>

</div>

<!-- MAPA -->

<div class="card">

<h3>Mapa sensorial</h3>

<div id="map"></div>

</div>

<!-- MICROFONE -->

<div class="card">

<h3>Detector de barulho</h3>

<button onclick="iniciarAudio()">Medir ruído</button>

<h2 id="nivelSom">0</h2>

</div>

<!-- FOTO -->

<div class="card">

<h3>Analisar ambiente por foto</h3>

<input type="file" id="foto">

<button onclick="analisarFoto()">Analisar</button>

<p id="resultadoFoto"></p>

</div>

<!-- ANALISE -->

<div class="card">

<h3>Analisar local</h3>

<input id="local">

<button onclick="analisar()">Analisar</button>

<h2 id="resultado"></h2>

<canvas id="grafico"></canvas>

</div>

<!-- RANKING -->

<div class="card">

<h3>Lugares mais seguros</h3>

<div id="ranking"></div>

</div>

<!-- COMUNIDADE -->

<div class="card">

<h3>Comunidade</h3>

<textarea id="postText" placeholder="Compartilhe sua experiência"></textarea>

<button onclick="postar()">Publicar</button>

<div id="feed"></div>

</div>

</div>

<script>

let map
let chart

// MAPA

function initMap(){

map=new google.maps.Map(document.getElementById("map"),{

center:{lat:-23.18,lng:-46.88},
zoom:12

})

}

window.onload=initMap

// LOGIN

function login(){

let email=document.getElementById("email").value

localStorage.setItem("user",email)

document.getElementById("loginStatus").innerText="Logado como "+email

}

// PERFIL

function salvarPerfil(){

let perfil=document.getElementById("perfil").value

localStorage.setItem("perfil",perfil)

alert("Perfil salvo")

}

// MICROFONE

async function iniciarAudio(){

let stream=await navigator.mediaDevices.getUserMedia({audio:true})

let ctx=new AudioContext()

let mic=ctx.createMediaStreamSource(stream)

let analyser=ctx.createAnalyser()

mic.connect(analyser)

let data=new Uint8Array(analyser.frequencyBinCount)

setInterval(()=>{

analyser.getByteFrequencyData(data)

let volume=data.reduce((a,b)=>a+b)/data.length

document.getElementById("nivelSom").innerText=Math.round(volume)

},500)

}

// FOTO

function analisarFoto(){

let arquivo=document.getElementById("foto").files[0]

if(!arquivo)return

let indice=Math.floor(Math.random()*100)

let texto=""

if(indice<40)texto="Ambiente confortável"

else if(indice<70)texto="Estímulo moderado"

else texto="Alto estímulo sensorial"

document.getElementById("resultadoFoto").innerText=texto

}

// ANALISE LOCAL

function analisar(){

let local=document.getElementById("local").value

let indice=Math.floor(Math.random()*100)

let texto=""

if(indice<40)texto="Ambiente confortável"

else if(indice<70)texto="Estímulo moderado"

else texto="Alto estímulo sensorial"

document.getElementById("resultado").innerText=local+" → "+texto

salvarRanking(local,indice)

gerarGrafico(indice)

}

// GRAFICO

function gerarGrafico(valor){

let dados=[valor,valor+10,valor-5,valor+15]

let labels=["Agora","+1h","+2h","+3h"]

if(chart)chart.destroy()

chart=new Chart(document.getElementById("grafico"),{

type:'line',

data:{
labels:labels,
datasets:[{
label:"Previsão sensorial",
data:dados,
borderColor:"#38bdf8"
}]
}

})

}

// RANKING

function salvarRanking(local,indice){

let dados=JSON.parse(localStorage.getItem("ranking"))||[]

dados.push({local,indice})

localStorage.setItem("ranking",JSON.stringify(dados))

renderRanking()

}

function renderRanking(){

let dados=JSON.parse(localStorage.getItem("ranking"))||[]

dados.sort((a,b)=>a.indice-b.indice)

let html=""

dados.slice(0,5).forEach(d=>{

html+=`<div class="rank-item">${d.local} - ${d.indice}</div>`

})

document.getElementById("ranking").innerHTML=html

}

renderRanking()

// COMUNIDADE

function postar(){

let texto=document.getElementById("postText").value

let posts=JSON.parse(localStorage.getItem("posts"))||[]

posts.push(texto)

localStorage.setItem("posts",JSON.stringify(posts))

renderFeed()

}

function renderFeed(){

let posts=JSON.parse(localStorage.getItem("posts"))||[]

let html=""

posts.reverse().forEach(p=>{

html+=`<div class="post">${p}</div>`

})

document.getElementById("feed").innerHTML=html

}

renderFeed()

// PWA

if("serviceWorker" in navigator){

navigator.serviceWorker.register(URL.createObjectURL(

new Blob([`

self.addEventListener('install',e=>self.skipWaiting())

`],{type:'text/javascript'})))

}

</script>

</body>
</html>

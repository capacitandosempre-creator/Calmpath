<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalmPath</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: radial-gradient(circle at 20% 20%, #0f172a, #020617 70%);
  font-family: system-ui, -apple-system, sans-serif;
}

.glass {
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255,255,255,0.06);
}

.glow {
  box-shadow: 0 0 20px rgba(16,185,129,0.4);
}

.progress-bar {
  transition: width 0.6s ease;
}

.metric-card {
  transition: transform 0.3s ease;
}
.metric-card:hover {
  transform: scale(1.03);
}
</style>
</head>

<body class="text-slate-200 min-h-screen p-6">

<header class="text-center mb-8">
  <h1 class="text-5xl font-semibold text-emerald-400 tracking-wide">CalmPath</h1>
  <p class="text-slate-400 mt-2">Inteligência sensorial preditiva</p>
</header>

<main class="max-w-md mx-auto space-y-6">

<div class="glass p-6 rounded-3xl">
  <input id="search" type="text"
  placeholder="Digite um local..."
  class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white outline-none mb-4">

  <select id="perfil"
  class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 mb-4">
    <option value="normal">Perfil padrão</option>
    <option value="autista">Pessoa autista</option>
    <option value="crianca">Criança sensível</option>
    <option value="idoso">Idoso</option>
    <option value="luz">Sensível à luz</option>
    <option value="ruido">Sensível a ruído</option>
  </select>

  <button onclick="buscarLocal()"
  class="w-full bg-emerald-600 hover:bg-emerald-700 p-4 rounded-xl font-medium glow">
  Analisar ambiente
  </button>
</div>

<div id="dashboard" class="hidden space-y-6">

<div class="glass p-6 rounded-3xl text-center">
  <h2 id="nomeLocal" class="text-xl font-semibold mb-2"></h2>
  <p id="indiceGeral" class="text-4xl font-bold text-emerald-400"></p>

  <div class="w-full bg-slate-800 rounded-full h-3 mt-4">
    <div id="barraGeral"
    class="h-3 rounded-full bg-emerald-500 progress-bar"
    style="width: 0%">
    </div>
  </div>

  <p id="classificacao" class="mt-3 text-sm text-slate-400"></p>
</div>

<div class="grid grid-cols-2 gap-4">

<div class="glass p-4 rounded-2xl metric-card">
  <p>🔊 Ruído</p>
  <div class="w-full bg-slate-800 rounded-full h-2 mt-2">
    <div id="ruidoBar" class="h-2 bg-emerald-500 rounded-full progress-bar"></div>
  </div>
</div>

<div class="glass p-4 rounded-2xl metric-card">
  <p>💡 Luz</p>
  <div class="w-full bg-slate-800 rounded-full h-2 mt-2">
    <div id="luzBar" class="h-2 bg-emerald-500 rounded-full progress-bar"></div>
  </div>
</div>

<div class="glass p-4 rounded-2xl metric-card">
  <p>👥 Densidade</p>
  <div class="w-full bg-slate-800 rounded-full h-2 mt-2">
    <div id="densidadeBar" class="h-2 bg-emerald-500 rounded-full progress-bar"></div>
  </div>
</div>

<div class="glass p-4 rounded-2xl metric-card">
  <p>🚗 Trânsito</p>
  <div class="w-full bg-slate-800 rounded-full h-2 mt-2">
    <div id="transitoBar" class="h-2 bg-emerald-500 rounded-full progress-bar"></div>
  </div>
</div>

</div>

<div class="glass p-4 rounded-2xl text-center">
  <p id="melhorHorario" class="text-sm text-emerald-400"></p>
</div>

</div>

</main>

<script>

async function buscarLocal() {

  const query = document.getElementById("search").value;
  const perfil = document.getElementById("perfil").value;

  if(query.length < 3) return;

  const response = await fetch(
  `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`
  );

  const data = await response.json();

  if(data.length === 0) return;

  const nome = data[0].display_name.split(",")[0];
  document.getElementById("nomeLocal").innerText = nome;

  calcularSensores(perfil);

  document.getElementById("dashboard").classList.remove("hidden");
}

function calcularSensores(perfil){

  const hora = new Date().getHours();
  const dia = new Date().getDay();

  let ruido = 30 + (hora >=12 && hora <=14 ? 30 : 0);
  let densidade = 40 + (dia === 6 ? 25 : 0);
  let luz = (hora >=18 || hora <=6) ? 70 : 30;
  let transito = (hora >=17 && hora <=19) ? 70 : 30;

  if(perfil === "autista"){ ruido+=20; densidade+=15; }
  if(perfil === "crianca"){ ruido+=10; }
  if(perfil === "idoso"){ transito+=15; }
  if(perfil === "luz"){ luz+=30; }
  if(perfil === "ruido"){ ruido+=30; }

  ruido = Math.min(100,ruido);
  densidade = Math.min(100,densidade);
  luz = Math.min(100,luz);
  transito = Math.min(100,transito);

  atualizarUI(ruido,luz,densidade,transito);
}

function atualizarUI(r,l,d,t){

  document.getElementById("ruidoBar").style.width = r+"%";
  document.getElementById("luzBar").style.width = l+"%";
  document.getElementById("densidadeBar").style.width = d+"%";
  document.getElementById("transitoBar").style.width = t+"%";

  const geral = Math.round((r+l+d+t)/4);

  document.getElementById("indiceGeral").innerText = geral+"/100";
  document.getElementById("barraGeral").style.width = geral+"%";

  let texto="";
  if(geral<40) texto="Zona Sensorial Segura";
  else if(geral<70) texto="Atenção Sensorial";
  else texto="Alta Sobrecarga";

  document.getElementById("classificacao").innerText = texto;

  const melhor = (geral>60) ? "Melhor horário hoje: 9h às 11h" :
                  "Horário atual favorável";

  document.getElementById("melhorHorario").innerText = melhor;
}

</script>

</body>
</html>

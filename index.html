<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalmPath</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background:#0f172a;
    color:#f1f5f9;
}

.container{
    max-width:700px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    font-weight:600;
    margin-bottom:10px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:16px;
    margin-top:20px;
    box-shadow:0 0 20px rgba(0,0,0,0.3);
}

input,button{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:none;
    margin-top:10px;
    font-size:15px;
}

input{
    background:#334155;
    color:white;
}

button{
    background:#3b82f6;
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#2563eb;
}

.progress{
    height:18px;
    border-radius:10px;
    margin-top:10px;
    background:#334155;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    transition:0.5s;
}

.status{
    font-size:18px;
    margin-top:10px;
    font-weight:600;
}

.small{
    font-size:13px;
    opacity:0.7;
}

.checklist label{
    display:block;
    margin-top:8px;
}

input[type="checkbox"]{
    width:auto;
    margin-right:8px;
}

.footer{
    text-align:center;
    font-size:12px;
    opacity:0.5;
    margin-top:30px;
}
</style>
</head>

<body>

<div class="container">

<h1>CalmPath</h1>
<p style="text-align:center;opacity:0.7;">Planejamento sensorial antes de sair</p>

<div class="card">
<input type="text" id="localInput" placeholder="Digite o nome do local">
<button onclick="buscarLocal()">Analisar Local</button>
</div>

<div id="resultado" class="card" style="display:none;">

<h3 id="nomeLocal"></h3>

<div class="progress">
<div id="barra" class="progress-bar"></div>
</div>

<div class="status" id="statusTexto"></div>
<p class="small" id="explicacao"></p>
<p class="small" id="fonteDados"></p>

</div>

<div id="checklistCard" class="card" style="display:none;">
<h3>Plano rápido antes de sair</h3>

<div class="checklist">
<label><input type="checkbox" id="c1">Levar abafador / fone</label>
<label><input type="checkbox" id="c2">Definir tempo máximo</label>
<label><input type="checkbox" id="c3">Planejar saída estratégica</label>
<label><input type="checkbox" id="c4">Ter plano alternativo</label>
</div>

</div>

<div id="historicoCard" class="card" style="display:none;">
<h3>Seu histórico</h3>
<p id="historicoTexto" class="small"></p>
</div>

<div class="footer">
CalmPath • Organização sensorial familiar
</div>

</div>

<script>

let localAtual = "";

function buscarLocal(){
    const nome = document.getElementById("localInput").value.trim();
    if(!nome) return;

    localAtual = nome;
    document.getElementById("nomeLocal").innerText = nome;
    document.getElementById("resultado").style.display="block";
    document.getElementById("checklistCard").style.display="block";
    document.getElementById("historicoCard").style.display="block";

    carregarChecklist();
    calcularIndice();
    carregarHistorico();
}

function calcularIndice(){

    const hora = new Date().getHours();
    const dia = new Date().getDay();

    let base = 30;

    if(hora >=12 && hora <=14) base += 25;
    if(hora >=17 && hora <=19) base += 30;
    if(dia==6 || dia==0) base += 20;
    if(hora >=21) base -= 15;

    let comunidade = JSON.parse(localStorage.getItem("com_"+localAtual));
    let fonte="Baseado em previsão inteligente";

    if(comunidade){
        const minutos = (Date.now() - comunidade.timestamp)/60000;
        if(minutos < 60){
            base = Math.round((base + comunidade.indice)/2);
            fonte="Atualizado pela comunidade há "+Math.round(minutos)+" min";
        }
    }

    if(base < 0) base = 0;
    if(base > 100) base = 100;

    atualizarUI(base);
    document.getElementById("fonteDados").innerText = fonte;

    salvarHistorico(base);
}

function atualizarUI(valor){

    const barra = document.getElementById("barra");
    barra.style.width = valor+"%";

    let cor="";
    let texto="";
    let explicacao="";

    if(valor <=30){
        cor="#22c55e";
        texto="🟢 Ideal para sair";
        explicacao="Ambiente tende a ser confortável para a maioria dos perfis sensoriais.";
    }
    else if(valor <=60){
        cor="#eab308";
        texto="🟡 Exige preparação leve";
        explicacao="Pode haver estímulos moderados. Planejamento simples recomendado.";
    }
    else if(valor <=80){
        cor="#f97316";
        texto="🟠 Planejamento recomendado";
        explicacao="Alta chance de estímulos intensos. Considere estratégias de regulação.";
    }
    else{
        cor="#ef4444";
        texto="🔴 Alto risco sensorial";
        explicacao="Ambiente pode gerar sobrecarga. Avalie horário alternativo.";
    }

    barra.style.background=cor;
    document.getElementById("statusTexto").innerText="Índice: "+valor+"/100 — "+texto;
    document.getElementById("explicacao").innerText=explicacao;
}

function salvarHistorico(indice){
    const dados={
        indice:indice,
        data:new Date().toLocaleString()
    };
    localStorage.setItem("hist_"+localAtual,JSON.stringify(dados));
}

function carregarHistorico(){
    const dados=JSON.parse(localStorage.getItem("hist_"+localAtual));
    if(dados){
        document.getElementById("historicoTexto").innerText=
        "Última consulta: "+dados.data+
        " | Índice registrado: "+dados.indice+"/100";
    }else{
        document.getElementById("historicoTexto").innerText=
        "Você ainda não consultou este local antes.";
    }
}

function carregarChecklist(){
    ["c1","c2","c3","c4"].forEach(id=>{
        const salvo=localStorage.getItem(localAtual+"_"+id);
        document.getElementById(id).checked = salvo==="true";

        document.getElementById(id).onchange=function(){
            localStorage.setItem(localAtual+"_"+id,this.checked);
        }
    });
}

</script>

</body>
</html>

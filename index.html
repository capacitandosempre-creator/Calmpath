<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalmPath</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    background:radial-gradient(circle at top,#0f172a,#020617);
    color:#e2e8f0;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
    font-size:32px;
    background:linear-gradient(90deg,#38bdf8,#6366f1);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.card{
    background:rgba(30,41,59,0.6);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:20px;
    margin-top:20px;
}

input,button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border-radius:12px;
    border:none;
    font-size:14px;
}

input{
    background:#1e293b;
    color:white;
}

button{
    background:linear-gradient(90deg,#6366f1,#3b82f6);
    color:white;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    opacity:0.85;
}

.gauge{
    width:240px;
    height:240px;
    margin:auto;
    position:relative;
}

svg{ transform:rotate(-90deg); }

circle{
    fill:none;
    stroke-width:16;
    stroke-linecap:round;
}

#progressCircle{
    stroke:#22d3ee;
    stroke-dasharray:565;
    stroke-dashoffset:565;
    transition:1s ease;
}

.centerText{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    text-align:center;
}

.centerText h2{
    font-size:42px;
    margin:0;
}

.status{
    text-align:center;
    margin-top:15px;
    font-weight:500;
}

.small{
    font-size:13px;
    opacity:0.7;
    text-align:center;
}

.feedback-buttons button{
    margin-top:8px;
}
</style>
</head>

<body>
<div class="container">

<h1>CalmPath</h1>

<!-- PERFIL -->
<div id="perfilCard" class="card" style="display:none;">
<h3>Configure seu Perfil Sensorial</h3>

<label>Sensibilidade a Ruído (0-10)</label>
<input type="number" id="pRuido" min="0" max="10">

<label>Sensibilidade à Luz (0-10)</label>
<input type="number" id="pLuz" min="0" max="10">

<label>Sensibilidade a Movimento (0-10)</label>
<input type="number" id="pMov" min="0" max="10">

<button onclick="salvarPerfil()">Salvar Perfil</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

<div class="card">
<input type="text" id="localInput" placeholder="Digite o local">
<button onclick="buscarLocal()">Analisar Ambiente</button>
</div>

<div id="dashboard" class="card" style="display:none;">

<div class="gauge">
<svg width="240" height="240">
<circle cx="120" cy="120" r="90" stroke="#1e293b"/>
<circle id="progressCircle" cx="120" cy="120" r="90"/>
</svg>
<div class="centerText">
<h2 id="indiceValor">0</h2>
<p>Índice Personalizado</p>
</div>
</div>

<div class="status" id="statusTexto"></div>
<p class="small">IA adaptativa baseada no seu perfil e histórico</p>

<h3>Como foi sua experiência?</h3>
<div class="feedback-buttons">
<button onclick="feedback(1)">👍 Confortável</button>
<button onclick="feedback(0)">😐 Moderado</button>
<button onclick="feedback(-1)">😣 Difícil</button>
</div>

</div>
</div>

</div>

<script>

let perfil = JSON.parse(localStorage.getItem("perfilCalmPath"));
let memoriaLocais = JSON.parse(localStorage.getItem("memoriaCalmPath")) || {};
let localAtual="";
let ultimaLeitura=null;

const circ=2*Math.PI*90;

if(!perfil){
    document.getElementById("perfilCard").style.display="block";
}else{
    iniciarApp();
}

function salvarPerfil(){
    perfil={
        ruido:Number(document.getElementById("pRuido").value)||5,
        luz:Number(document.getElementById("pLuz").value)||5,
        mov:Number(document.getElementById("pMov").value)||5
    };
    localStorage.setItem("perfilCalmPath",JSON.stringify(perfil));
    iniciarApp();
}

function iniciarApp(){
    document.getElementById("perfilCard").style.display="none";
    document.getElementById("app").style.display="block";
}

function buscarLocal(){
    const nome=document.getElementById("localInput").value.trim();
    if(!nome) return;

    localAtual=nome;
    document.getElementById("dashboard").style.display="block";
    calcularIndice();
}

function calcularIndice(){

    const hora=new Date().getHours();
    const dia=new Date().getDay();

    let ruido=30,luz=30,mov=30;

    if(hora>=12 && hora<=14){ ruido+=25; mov+=30; }
    if(hora>=17 && hora<=19){ mov+=35; }
    if(dia==0 || dia==6){ mov+=20; }

    if(memoriaLocais[localAtual]){
        ruido+=memoriaLocais[localAtual].ruidoAjuste||0;
        luz+=memoriaLocais[localAtual].luzAjuste||0;
        mov+=memoriaLocais[localAtual].movAjuste||0;
    }

    ruido=Math.max(0,Math.min(100,ruido));
    luz=Math.max(0,Math.min(100,luz));
    mov=Math.max(0,Math.min(100,mov));

    ultimaLeitura={ruido,luz,mov};

    const somaPesos=perfil.ruido+perfil.luz+perfil.mov;

    const indice=Math.round(
        (ruido*perfil.ruido +
         luz*perfil.luz +
         mov*perfil.mov) / somaPesos
    );

    atualizarUI(indice);
}

function atualizarUI(indice){

    document.getElementById("indiceValor").innerText=indice;

    const offset=circ-(indice/100)*circ;
    document.getElementById("progressCircle").style.strokeDashoffset=offset;

    let cor="#22d3ee";
    let status="Ambiente confortável";

    if(indice>60){
        cor="#f97316";
        status="Planejamento recomendado";
    }
    if(indice>80){
        cor="#ef4444";
        status="Alto risco sensorial";
    }

    document.getElementById("progressCircle").style.stroke=cor;
    document.getElementById("progressCircle").style.filter="drop-shadow(0 0 15px "+cor+")";
    document.getElementById("statusTexto").innerText=status;
}

function feedback(tipo){

    if(!ultimaLeitura) return;

    const {ruido,luz,mov}=ultimaLeitura;

    let dominante="ruido";
    let maior=ruido;

    if(luz>maior){ dominante="luz"; maior=luz; }
    if(mov>maior){ dominante="mov"; maior=mov; }

    if(tipo==-1){
        perfil[dominante]+=0.5;
        ajustarMemoria(dominante,3);
    }

    if(tipo==1){
        perfil[dominante]=Math.max(1,perfil[dominante]-0.3);
        ajustarMemoria(dominante,-2);
    }

    localStorage.setItem("perfilCalmPath",JSON.stringify(perfil));
    localStorage.setItem("memoriaCalmPath",JSON.stringify(memoriaLocais));

    calcularIndice();
}

function ajustarMemoria(dim,valor){

    if(!memoriaLocais[localAtual]){
        memoriaLocais[localAtual]={
            ruidoAjuste:0,
            luzAjuste:0,
            movAjuste:0
        };
    }

    if(dim==="ruido") memoriaLocais[localAtual].ruidoAjuste+=valor;
    if(dim==="luz") memoriaLocais[localAtual].luzAjuste+=valor;
    if(dim==="mov") memoriaLocais[localAtual].movAjuste+=valor;
}

</script>

</body>
</html>

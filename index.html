<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>CalmPath</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
margin:0;
font-family:Segoe UI;
background:#0f172a;
color:white;
}

header{
background:#020617;
padding:20px;
text-align:center;
}

h1{
color:#38bdf8;
}

.container{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:16px;
margin-top:20px;
}

input,button,select{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
}

button{
background:#3b82f6;
color:white;
cursor:pointer;
}

button:hover{
background:#6366f1;
}

.ranking{
margin-top:10px;
}

.rank-item{
padding:8px;
border-bottom:1px solid #334155;
}

canvas{
background:#020617;
border-radius:10px;
padding:10px;
}

</style>

</head>

<body>

<header>

<h1>CalmPath</h1>
<p>Mapa sensorial para pessoas neurodivergentes</p>

</header>

<div class="container">

<div class="card">

<h3>Login</h3>

<input id="email" placeholder="Seu email">

<button onclick="login()">Entrar</button>

<p id="statusLogin"></p>

</div>

<div class="card">

<h3>Perfil sensorial</h3>

<select id="perfil">

<option value="luz">Sensível à luz</option>
<option value="som">Sensível a barulho</option>
<option value="multidao">Sensível à multidão</option>

</select>

<button onclick="salvarPerfil()">Salvar perfil</button>

</div>

<div class="card">

<h3>Analisar ambiente</h3>

<input id="local" placeholder="Digite um local">

<button onclick="analisar()">Analisar</button>

<h2 id="resultado"></h2>

<canvas id="grafico"></canvas>

</div>

<div class="card">

<h3>Ranking lugares mais seguros</h3>

<div id="ranking"></div>

</div>

</div>

<script>

let chart

function login(){

let email=document.getElementById("email").value

localStorage.setItem("user",email)

document.getElementById("statusLogin").innerText="Logado como "+email

}

function salvarPerfil(){

let perfil=document.getElementById("perfil").value

localStorage.setItem("perfilSensorial",perfil)

alert("Perfil salvo")

}

function analisar(){

let local=document.getElementById("local").value

if(!local)return

let indice=Math.floor(Math.random()*100)

let texto=""

if(indice<40) texto="Ambiente confortável"

else if(indice<70) texto="Estímulo moderado"

else texto="Alto estímulo sensorial"

document.getElementById("resultado").innerText=local+" → "+texto+" ("+indice+")"

salvarRanking(local,indice)

gerarGrafico(indice)

}

function gerarGrafico(valor){

let dados=[valor,valor+10,valor-5,valor+15,valor-10]

let labels=["Agora","+1h","+2h","+3h","+4h"]

if(chart) chart.destroy()

chart=new Chart(document.getElementById("grafico"),{

type:'line',

data:{
labels:labels,
datasets:[{
label:"Previsão sensorial",
data:dados,
borderColor:"#38bdf8",
fill:false
}]
},

options:{responsive:true}

})

}

function salvarRanking(local,indice){

let dados=JSON.parse(localStorage.getItem("ranking"))||[]

dados.push({local,indice})

localStorage.setItem("ranking",JSON.stringify(dados))

renderRanking()

}

function renderRanking(){

let dados=JSON.parse(localStorage.getItem("ranking"))||[]

dados.sort((a,b)=>a.indice-b.indice)

let html=""

dados.slice(0,5).forEach(d=>{

html+=`<div class="rank-item">${d.local} - índice ${d.indice}</div>`

})

document.getElementById("ranking").innerHTML=html

}

renderRanking()

</script>

</body>

</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalmPath</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(180deg, #0f172a, #0b1120);
  font-family: system-ui, -apple-system, sans-serif;
}

.glass {
  background: rgba(30, 41, 59, 0.6);
  backdrop-filter: blur(14px);
  border: 1px solid rgba(255,255,255,0.05);
}

.soft-green { background: #064e3b; }
.soft-yellow { background: #78350f; }
.soft-red { background: #7f1d1d; }

.fade-in {
  animation: fade 0.5s ease-in-out;
}

@keyframes fade {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body class="min-h-screen text-slate-200 p-6">

<header class="text-center mb-8">
  <h1 class="text-4xl font-semibold text-emerald-400">CalmPath</h1>
  <p class="text-slate-400 text-sm mt-2">
    Inteligência sensorial para decisões mais tranquilas
  </p>
</header>

<main class="max-w-md mx-auto space-y-6">

<div class="glass p-6 rounded-3xl">
  <input id="search" type="text"
  placeholder="Digite um local (ex: Shopping Ibirapuera São Paulo)"
  class="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 text-white outline-none mb-4">

  <button onclick="buscarLocal()"
  class="w-full bg-emerald-600 hover:bg-emerald-700 transition p-4 rounded-xl font-medium">
  Analisar ambiente
  </button>

  <p id="erro" class="text-red-400 text-sm mt-3 hidden">
    Local não encontrado. Tente incluir a cidade.
  </p>
</div>

<div id="resultado" class="hidden glass p-6 rounded-3xl space-y-4 fade-in">

  <div>
    <h2 id="nomeLocal" class="text-xl font-semibold"></h2>
    <p id="enderecoLocal" class="text-slate-400 text-sm"></p>
  </div>

  <div id="statusBox" class="p-6 rounded-2xl text-center transition-all duration-500">
    <div id="statusTexto" class="text-2xl font-semibold mb-2"></div>
    <p id="descricaoTexto" class="text-sm opacity-80"></p>
  </div>

  <div class="glass p-4 rounded-xl">
    <p class="text-sm mb-3 text-slate-400">Como está agora?</p>

    <div class="flex gap-2">
      <button onclick="registrarRelato(20)"
      class="flex-1 bg-emerald-700 hover:bg-emerald-800 p-2 rounded-lg">
      Tranquilo
      </button>

      <button onclick="registrarRelato(50)"
      class="flex-1 bg-yellow-700 hover:bg-yellow-800 p-2 rounded-lg">
      Moderado
      </button>

      <button onclick="registrarRelato(80)"
      class="flex-1 bg-red-700 hover:bg-red-800 p-2 rounded-lg">
      Intenso
      </button>
    </div>

    <p id="infoRelato" class="text-xs text-slate-500 mt-3"></p>
  </div>

</div>

</main>

<script>

let ultimoLocal = "";

async function buscarLocal() {

  const query = document.getElementById("search").value;

  if (query.length < 3) return;

  document.getElementById("erro").classList.add("hidden");

  try {
    const response = await fetch(
      `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`
    );

    const data = await response.json();

    if (data.length === 0) {
      document.getElementById("erro").classList.remove("hidden");
      return;
    }

    const local = data[0];

    ultimoLocal = local.display_name;

    document.getElementById("nomeLocal").innerText = local.display_name.split(",")[0];
    document.getElementById("enderecoLocal").innerText = local.display_name;

    calcularStatus();

    document.getElementById("resultado").classList.remove("hidden");

    mostrarRelatoSalvo();

  } catch {
    document.getElementById("erro").classList.remove("hidden");
  }
}

function calcularStatus() {

  const agora = new Date();
  const hora = agora.getHours();
  const dia = agora.getDay();

  let indice = 40;

  if (hora >= 12 && hora <= 14) indice += 20;
  if (hora >= 18 && hora <= 20) indice += 15;
  if (dia === 5 && hora >= 18) indice += 20;
  if (dia === 0) indice += 15;

  const relato = JSON.parse(localStorage.getItem(ultimoLocal));

  if (relato && (Date.now() - relato.timestamp < 3600000)) {
    indice = (indice * 0.7) + (relato.valor * 0.3);
  }

  mostrarStatus(indice);
}

function mostrarStatus(indice) {

  const box = document.getElementById("statusBox");

  if (indice < 40) {
    box.className = "p-6 rounded-2xl text-center transition-all duration-500 soft-green";
    statusTexto.innerText = "Zona Segura";
    descricaoTexto.innerText = "Ambiente tende a estar mais tranquilo.";
  } 
  else if (indice < 70) {
    box.className = "p-6 rounded-2xl text-center transition-all duration-500 soft-yellow";
    statusTexto.innerText = "Atenção Sensorial";
    descricaoTexto.innerText = "Pode haver movimento moderado.";
  } 
  else {
    box.className = "p-6 rounded-2xl text-center transition-all duration-500 soft-red";
    statusTexto.innerText = "Estímulo Elevado";
    descricaoTexto.innerText = "Ambiente possivelmente intenso.";
  }
}

function registrarRelato(valor) {

  const relato = {
    valor: valor,
    timestamp: Date.now()
  };

  localStorage.setItem(ultimoLocal, JSON.stringify(relato));

  mostrarRelatoSalvo();
  calcularStatus();
}

function mostrarRelatoSalvo() {

  const relato = JSON.parse(localStorage.getItem(ultimoLocal));

  if (!relato) {
    infoRelato.innerText = "";
    return;
  }

  const minutos = Math.floor((Date.now() - relato.timestamp) / 60000);

  infoRelato.innerText = `Último relato enviado há ${minutos} minuto(s).`;
}

</script>

</body>
</html>
